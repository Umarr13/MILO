name: Flutter Android Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Scaffold Android Project
        run: |
          flutter create --platforms android scaffold_tmp
          mv scaffold_tmp/android app/android
          rm -rf scaffold_tmp
          
      - name: Install Dependencies
        working-directory: ./app
        run: flutter pub get
        
      - name: Build APK
        working-directory: ./app
        run: flutter build apk --release
        
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Milo Analytics Beta v0.1.0"
          body: "Initial Beta Release for Milo Sports Intelligence Platform."
          draft: false
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
