name: Nightly Data Pipeline Sync

on:
  schedule:
    - cron: '0 4 * * *' # Runs at 04:00 UTC every day
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Data Pipeline Sync
        run: python data_pipeline/sync.py
        
      - name: Commit Updated SQLite DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add milo.db
          git commit -m "chore: nightly database sync" || echo "No changes to commit"
          git push
