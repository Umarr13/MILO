version: '3.8'

services:
  backend:
    build: .
    container_name: milo_backend
    restart: always
    expose:
      - "8000"
    environment:
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY}
    volumes:
      - ./milo.db:/usr/src/app/milo.db

  nginx:
    image: nginx:alpine
    container_name: milo_nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL is configured
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
